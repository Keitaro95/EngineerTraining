<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダンス練習プレイヤー</title>
  </head>
  <body>
    <main class="app">
      <h1>ダンス練習プレイヤー</h1>

      <section class="source">
        <form id="url-form" class="row">
          <input id="url-input" type="text" inputmode="url" placeholder="YouTubeのURLを貼り付け（例: https://youtu.be/xxxxxxxxxxx）" required />
          <button type="submit">読み込む</button>
        </form>
        <label class="file-label">
          または手元の動画ファイルを開く（0.10倍までなめらかに再生）
          <input id="file-input" type="file" accept="video/*" />
        </label>
        <p id="message" class="message" hidden></p>
      </section>

      <div id="player" class="player">
        <section id="stage" class="stage">
          <div id="yt-player"></div>
          <video id="local-video" playsinline hidden></video>
          <p class="placeholder">URLを入力するか、動画ファイルを選んでください</p>
        </section>

        <section id="controls" class="controls" hidden>
          <div class="row">
            <button id="back" type="button" title="5秒戻る (←)">−5秒</button>
            <button id="play" type="button" class="primary" title="再生/一時停止 (Space)">▶ 再生</button>
            <button id="forward" type="button" title="5秒進む (→)">+5秒</button>
            <div class="loop" role="group" aria-label="区間ループ">
              <button id="loop-a" type="button" title="今の位置をループ開始点にする (A)">開始 <span id="loop-a-time">--:--</span></button>
              <button id="loop-b" type="button" title="今の位置をループ終了点にする (B)">終了 <span id="loop-b-time">--:--</span></button>
              <label class="loop-count" title="ループ回数">
                <input id="loop-count" type="number" min="1" max="99" value="3" /> 回
              </label>
              <button id="loop-toggle" type="button" title="区間ループ開始/停止 (L)" disabled>🔁 ループ</button>
              <span id="loop-status" class="loop-status"></span>
            </div>
            <label class="toggle" title="左右反転 (M)">
              <input id="mirror" type="checkbox" checked /> 左右反転
            </label>
            <button id="fullscreen" type="button" title="全画面表示 (F)">⛶ 全画面</button>
          </div>

          <div class="row seek">
            <span id="current">0:00</span>
            <input id="seek" type="range" min="0" max="0" step="0.1" value="0" />
            <span id="duration">0:00</span>
          </div>

          <div class="row speed">
            <span>速度</span>
            <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" />
            <output id="speed-value">1.00x</output>
          </div>
          <div class="row presets">
            <button type="button" data-rate="0.1">0.10</button>
            <button type="button" data-rate="0.25">0.25</button>
            <button type="button" data-rate="0.5">0.50</button>
            <button type="button" data-rate="0.75">0.75</button>
            <button type="button" data-rate="1">1.00</button>
            <button type="button" data-rate="1.5">1.50</button>
            <button type="button" data-rate="2">2.00</button>
          </div>
          <p id="emu-note" class="note" hidden>
            YouTubeが対応していない速度のため、再生と停止を細かく繰り返す「疑似スロー」で再生中です（カクカクします）。
            なめらかにしたい場合は、動画ファイルを開いて再生してください。
          </p>
          <p class="hint">ショートカット: Space 再生/停止 ・ ←/→ 5秒移動 ・ M 左右反転 ・ [ / ] 速度 −/＋0.05 ・ A / B ループ開始/終了点 ・ L ループ ・ F 全画面</p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
